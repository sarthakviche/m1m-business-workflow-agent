[alembic]
# Path to the migrations directory (relative to this alembic.ini file, i.e. backend/)
script_location = app/db/migrations

# File naming template for new revisions
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

# Prepend backend/ to sys.path when alembic runs from backend/ directory.
# env.py also does sys.path manipulation for robustness.
prepend_sys_path = .

version_path_separator = os

# sqlalchemy.url is intentionally left as a placeholder.
# It is overridden programmatically in env.py from the DATABASE_URL env var.
sqlalchemy.url = driver://user:pass@localhost/dbname


# ─── Logging ─────────────────────────────────────────────────────────────────
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
