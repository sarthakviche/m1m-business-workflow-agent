# Alembic configuration for M1M backend
# Run from the backend/ directory: alembic upgrade head

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os  # Use os.pathsep

# DATABASE_URL is loaded from .env by env.py — do NOT hardcode the URL here
sqlalchemy.url = 

[post_write_hooks]
# No post-write hooks needed for MVP

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
