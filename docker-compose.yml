version: "3.9"

# Local development only — use Supabase for all deployed environments.
# Backend in container talks to local Postgres (or Supabase via env var).

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: m1m
      POSTGRES_PASSWORD: m1m_dev
      POSTGRES_DB: m1m
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m1m"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
